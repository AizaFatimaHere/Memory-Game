<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Card Game</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="game">
    <h1>Memory Card Game</h1>
    <p>Find the matching cards.</p>
    <ul class="cards">
      <li class="card" data-card="1">
        <div class="front">?</div>
        <div class="back"><img src="images/img-1.png" alt="Card 1"></div>
      </li>
      <li class="card" data-card="2">
        <div class="front">?</div>
        <div class="back"><img src="images/img-2.png" alt="Card 2"></div>
      </li>
      <li class="card" data-card="3">
        <div class="front">?</div>
        <div class="back"><img src="images/img-3.png" alt="Card 3"></div>
      </li>
      <li class="card" data-card="4">
        <div class="front">?</div>
        <div class="back"><img src="images/img-4.png" alt="Card 4"></div>
      </li>
    </ul>
  </main>
  <script src="script.js"></script>
</body>

</html>
